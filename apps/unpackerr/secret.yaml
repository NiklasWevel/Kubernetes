apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unpackerr-secret
  namespace: unpackerr
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kubernetes
    kind: SecretStore
  target:
    name: unpackerr-secret
    template:
      engineVersion: v2
      data:
        UN_RADARR_0_API_KEY: "{{ .radarr_apikey }}"
        UN_SONARR_0_API_KEY: "{{ .sonarr_apikey }}"
        UN_LIDARR_0_API_KEY: "{{ .lidarr_apikey }}"
        UN_RADARR_whisparr_API_KEY: "{{ .whisparr_apikey }}"
        UN_WEBSERVER_UI_PASSWORD: "admin:{{ .webui_password }}"
  data:
    - secretKey: radarr_apikey
      remoteRef:
        key: apps/radarr
        property: apikey
    - secretKey: sonarr_apikey
      remoteRef:
        key: apps/sonarr
        property: apikey
    - secretKey: lidarr_apikey
      remoteRef:
        key: apps/lidarr
        property: apikey
    - secretKey: whisparr_apikey
      remoteRef:
        key: apps/whisparr
        property: apikey
    - secretKey: webui_password
      remoteRef:
        key: apps/unpackerr
        property: webui-password
