apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sonarr-lan
  namespace: sonarr
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`sonarr.wevelsiep.com`)
      kind: Rule
      priority: 1
      services:
        - name: sonarr
          port: 80
      middlewares:
        - name: oidc-auth
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sonarr-lan-health
  namespace: sonarr
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`sonarr.wevelsiep.com`) && Path(`/ping`)
      kind: Rule
      priority: 1000
      services:
        - name: sonarr
          port: 80
