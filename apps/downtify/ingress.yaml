apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: downtify-lan
  namespace: downtify
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`downtify.wevelsiep.com`)
      kind: Rule
      priority: 1
      services:
        - name: downtify
          port: 80
      middlewares:
        - name: oidc-auth
