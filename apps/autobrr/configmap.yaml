apiVersion: v1
kind: ConfigMap
metadata:
  name: autobrr-config
  namespace: autobrr
data:
  config.toml: |
    host = "0.0.0.0"
    port = 7474
    baseUrlModeLegacy = true
    checkForUpdates = false
    logLevel = "INFO"
    sessionSecret = "{{ .sessionSecret }}"
    metricsEnabled = false
    databaseType = "postgres"
    postgresHost = "autobrr-postgres-cluster-rw.autobrr-db.svc.cluster.local"
    postgresPort = 5432
    postgresDatabase = "autobrr-db"
    postgresUser = "{{ .postgresUser }}"
    postgresPass = "{{ .postgresPass }}"
    postgresSSLMode = "disable"
    postgresExtraParams = ""
    oidcEnabled = true
    oidcIssuer = "https://pocketid.wevelsiep.com"
    oidcClientId = {{ .oidc_client_id }}"
    oidcClientSecret = {{ .oidc_client_secret }}"
    oidcRedirectUrl = "https://autobrr.wevelsiep.com/api/auth/oidc/callback"
    oidcDisableBuiltInLogin = false
