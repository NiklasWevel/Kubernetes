apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper
  namespace: whisper
  labels:
    app: whisper
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: whisper
  template:
    metadata:
      labels:
        app: whisper
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        nvidia.com/gpu.present: "true"
        kubernetes.io/hostname: talos-node-02
      runtimeClassName: nvidia
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      containers:
        - name: whisper
          image: registry.wevelsiep.com/niklas/whisper:latest
          imagePullPolicy: Always
          env:
            - name: WHISPER_MODEL
              value: large-v3-turbo
            - name: WHISPER_LANGUAGE
              value: de
            - name: WHISPER_COMPUTE_TYPE
              value: float16
            - name: HF_HOME
              value: /models
            - name: HOME
              value: /tmp
          ports:
            - containerPort: 9000
          resources:
            requests:
              cpu: "100m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
              nvidia.com/gpu: "1"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: "RuntimeDefault"
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /health
              port: 9000
            failureThreshold: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 9000
            periodSeconds: 10
            failureThreshold: 3

          volumeMounts:
            - name: models
              mountPath: /models
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: whisper-models-pvc
        - name: data
          emptyDir:
            sizeLimit: 64Mi
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
