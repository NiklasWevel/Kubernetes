apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-app-ingress
  namespace: seerr
spec:
  endpointSelector: {}

  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
            app.kubernetes.io/name: traefik
        - matchLabels:
            io.kubernetes.pod.namespace: homepage
            app: homepage
        - matchLabels:
            io.kubernetes.pod.namespace: suggestarr
            app: suggestarr
      toPorts:
        - ports:
            - port: "5055"
              protocol: TCP
