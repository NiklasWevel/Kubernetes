apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: radarr-lan
  namespace: radarr
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`radarr.wevelsiep.com`)
      kind: Rule
      priority: 1
      services:
        - name: radarr
          port: 80
      middlewares:
        - name: oidc-auth
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: radarr-lan-health
  namespace: radarr
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`radarr.wevelsiep.com`) && Path(`/ping`)
      kind: Rule
      priority: 1000
      services:
        - name: radarr
          port: 80
