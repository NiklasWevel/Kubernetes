apiVersion: apps/v1
kind: Deployment
metadata:
  name: qui
  namespace: qui
  labels:
    app: qui
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: qui
  template:
    metadata:
      labels:
        app: qui
    spec:
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      containers:
        - name: qui
          image: ghcr.io/autobrr/qui:v1.28.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7476
          resources:
            requests:
              cpu: "100m"
              memory: "100Mi"
            limits:
              cpu: "500m"
              memory: "500Mi"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: "RuntimeDefault"
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /healthz/readiness
              port: 7476
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz/liveness
              port: 7476
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: qui-config
              mountPath: /config
            - name: qui-seedbox
              mountPath: /mnt/Seedbox
            - name: qui-data
              mountPath: /data
            - name: qui-icons
              mountPath: /config/tracker-icons
      volumes:
        - name: qui-config
          secret:
            secretName: qui-config-secret
        - name: qui-seedbox
          persistentVolumeClaim:
            claimName: qui-seedbox-pvc
        - name: qui-data
          emptyDir: {}
        - name: qui-icons
          emptyDir: {}
