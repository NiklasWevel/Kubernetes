apiVersion: v1
kind: ConfigMap
metadata:
  name: qui-config
  namespace: qui
data:
  config.toml: |
    host = "0.0.0.0"
    port = 7476
    logLevel = "INFO"
    checkForUpdates = true
    sessionSecret = "{{ .sessionSecret }}"
    dataDir = "/data"
    databaseEngine = "postgres"
    databaseHost = "qui-postgres-cluster-rw.qui-db.svc.cluster.local"
    databasePort = 5432
    databaseName = "qui-db"
    databaseUser = "{{ .postgresUser }}"
    databasePassword = "{{ .postgresPass }}"
    databaseSSLMode = "disable"
    oidcEnabled = true
    oidcIssuer = "https://pocketid.wevelsiep.com"
    oidcClientId = "{{ .oidc_client_id }}"
    oidcClientSecret = "{{ .oidc_client_secret }}"
    oidcRedirectUrl = "https://qui.wevelsiep.com/api/auth/oidc/callback"
    oidcDisableBuiltInLogin = false
