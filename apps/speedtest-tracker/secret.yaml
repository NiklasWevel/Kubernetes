apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: speedtest-tracker-config-secret
  namespace: speedtest-tracker
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kubernetes
    kind: SecretStore
  target:
    name: speedtest-tracker-config-secret
  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key: database/speedtest-tracker
        property: db_user
    - secretKey: DB_PASSWORD
      remoteRef:
        key: database/speedtest-tracker
        property: db_password
    - secretKey: APP_KEY
      remoteRef:
        key: apps/speedtest-tracker
        property: app_key
    - secretKey: ADMIN_NAME
      remoteRef:
        key: apps/speedtest-tracker
        property: admin_name
    - secretKey: ADMIN_EMAIL
      remoteRef:
        key: apps/speedtest-tracker
        property: admin_email
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: apps/speedtest-tracker
        property: admin_password
