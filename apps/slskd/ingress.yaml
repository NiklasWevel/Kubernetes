apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: slskd-lan
  namespace: slskd
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`slskd.wevelsiep.com`)
      kind: Rule
      priority: 1      
      services:
        - name: slskd
          port: 80
      middlewares:
        - name: oidc-auth          
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: slskd-lan-health
  namespace: slskd
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`slskd.wevelsiep.com`) && Path(`/health`)
      kind: Rule
      priority: 1000
      services:
        - name: slskd
          port: 80
