apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lidarr-lan
  namespace: lidarr
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`lidarr.wevelsiep.com`)
      kind: Rule
      priority: 1
      services:
        - name: lidarr
          port: 80
      middlewares:
        - name: oidc-auth
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lidarr-lan-health
  namespace: lidarr
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`lidarr.wevelsiep.com`) && Path(`/ping`)
      kind: Rule
      priority: 1000
      services:
        - name: lidarr
          port: 80
