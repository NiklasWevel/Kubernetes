apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-secret
  namespace: homepage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kubernetes
    kind: SecretStore
  target:
    name: homepage-secret
  data:
    - secretKey: HOMEPAGE_VAR_PROXMOX_USER
      remoteRef:
        key: apps/homepage
        property: proxmox_user
    - secretKey: HOMEPAGE_VAR_PROXMOX_PASSWORD
      remoteRef:
        key: apps/homepage
        property: proxmox_password
    - secretKey: HOMEPAGE_VAR_PBS_USER
      remoteRef:
        key: apps/homepage
        property: pbs_user
    - secretKey: HOMEPAGE_VAR_PBS_PASSWORD
      remoteRef:
        key: apps/homepage
        property: pbs_password
    - secretKey: HOMEPAGE_VAR_SPEEDTEST_KEY
      remoteRef:
        key: apps/homepage
        property: speedtest_apikey
    - secretKey: HOMEPAGE_VAR_JELLYFIN_KEY
      remoteRef:
        key: apps/homepage
        property: jellyfin_apikey
    - secretKey: HOMEPAGE_VAR_SEERR_KEY
      remoteRef:
        key: apps/homepage
        property: seerr_apikey
    - secretKey: HOMEPAGE_VAR_GLUETUN_KEY
      remoteRef:
        key: apps/homepage
        property: gluetun_apikey
    - secretKey: HOMEPAGE_VAR_QUI_KEY
      remoteRef:
        key: apps/homepage
        property: qui_apikey
    - secretKey: HOMEPAGE_VAR_SONARR_KEY
      remoteRef:
        key: apps/homepage
        property: sonarr_apikey
    - secretKey: HOMEPAGE_VAR_RADARR_KEY
      remoteRef:
        key: apps/homepage
        property: radarr_apikey
    - secretKey: HOMEPAGE_VAR_PAPERLESS_KEY
      remoteRef:
        key: apps/homepage
        property: paperless_apikey
    - secretKey: HOMEPAGE_VAR_OPENWEATHERMAP_KEY
      remoteRef:
        key: apps/homepage
        property: openweathermap_apikey
