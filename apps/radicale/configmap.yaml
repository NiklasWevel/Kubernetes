apiVersion: v1
kind: ConfigMap
metadata:
  name: radicale-config
  namespace: radicale
data:
  config: |
    [server]
    hosts = 0.0.0.0:5232

    [auth]
    type = htpasswd
    htpasswd_filename = /secrets/users
    htpasswd_encryption = autodetect

    [rights]
    type = owner_only

    [storage]
    filesystem_folder = /data/collections

    [web]
    type = internal

    [headers]
    Content-Security-Policy = default-src 'self'; object-src 'none'
