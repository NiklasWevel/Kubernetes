apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radicale-users
  namespace: radicale
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kubernetes
    kind: SecretStore
  target:
    name: radicale-users
    creationPolicy: Owner
  data:
    - secretKey: users
      remoteRef:
        key: apps/radicale
        property: htpasswd
