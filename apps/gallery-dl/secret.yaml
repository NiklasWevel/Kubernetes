apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gallery-dl-config-secret
  namespace: gallery-dl
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kubernetes
    kind: SecretStore
  target:
    name: gallery-dl-config-secret
  data:
    - secretKey: config.json
      remoteRef:
        key: apps/gallery-dl
        property: config.json
