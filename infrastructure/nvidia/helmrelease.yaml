apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
  namespace: gpu-operator
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: gpu-operator
      version: "v26.7.0"
      sourceRef:
        kind: HelmRepository
        name: nvidia-gpu-operator
        namespace: flux-system
  install:
    createNamespace: true
    crds: Create
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    driver:
      enabled: false
    toolkit:
      enabled: false
    devicePlugin:
      enabled: true
    dcgmExporter:
      enabled: true
