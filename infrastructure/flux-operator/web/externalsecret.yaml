apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-web-config
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kubernetes
    kind: SecretStore
  target:
    name: flux-web-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config.yaml: |
          apiVersion: web.fluxcd.controlplane.io/v1
          kind: Config
          spec:
            baseURL: https://flux.wevelsiep.com
            authentication:
              type: OAuth2
              oauth2:
                provider: OIDC
                issuerURL: https://pocketid.wevelsiep.com
                clientID: {{ .client_id }}
                clientSecret: {{ .client_secret }}
                scopes:
                  - openid
                  - profile
                  - email
                  - groups
                validations:
                  - expression: "has(claims.groups) && 'admin' in claims.groups"
                    message: "PocketID group admin required"
                impersonation:
                  username: "claims.email"
                  groups: "claims.groups.map(g, 'pocketid:' + g)"
            userActions:
              access: Impersonated
  data:
    - secretKey: client_id
      remoteRef:
        key: infrastructure/flux-operator
        property: oidc_client_id
    - secretKey: client_secret
      remoteRef:
        key: infrastructure/flux-operator
        property: oidc_client_secret
