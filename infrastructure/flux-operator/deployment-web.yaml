apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-flux-web
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/flux-operator/web
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infrastructure-flux-operator
    - name: infrastructure-external-secrets
    - name: infrastructure-traefik
    - name: repository-kuberneteshidden
