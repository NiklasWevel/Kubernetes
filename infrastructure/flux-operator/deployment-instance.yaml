apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-flux-instance
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/flux-operator/instance
  prune: false
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infrastructure-flux-operator
