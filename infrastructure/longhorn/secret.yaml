apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: longhorn-backup-secret
  namespace: longhorn-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kubernetes
    kind: SecretStore
  target:
    name: longhorn-backup-secret
    creationPolicy: Owner
    template:
      data:
        AWS_ACCESS_KEY_ID: "{{ .s3KeyId }}"
        AWS_SECRET_ACCESS_KEY: "{{ .s3SecretKey }}"
        AWS_ENDPOINTS: https://s3.wevelsiep.com
  data:
    - secretKey: s3KeyId
      remoteRef:
        key: infrastructure/longhorn
        property: s3_key_id
    - secretKey: s3SecretKey
      remoteRef:
        key: infrastructure/longhorn
        property: s3_secret_key
