apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: egress-allow-ntfy
spec:
  endpointSelector:
    matchExpressions:
      - key: io.cilium.k8s.namespace.labels.network-egress-ntfy
        operator: Exists
  egress:
    - toFQDNs:
        - matchName: "ntfy.wevelsiep.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
          serverNames:
            - ntfy.wevelsiep.com
