apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: autobrr-postgres-cluster
  namespace: autobrr-db
spec:
  instances: 1
  enablePDB: false
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  storage:
    storageClass: "local-path-delete"
    size: 10Gi

  bootstrap:
    recovery:
      source: s3-garage
      recoveryTarget:
        backupID: "20260924T092756"

  externalClusters:
    - name: s3-garage
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: s3-garage

  superuserSecret:
    name: postgres-superlogin

  managed:
    roles:
      - name: autobrr-user
        ensure: present
        login: true
        passwordSecret:
          name: autobrr-db-secret
